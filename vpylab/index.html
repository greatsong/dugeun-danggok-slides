<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPyLab 교사 연수</title>
<style>
@font-face{font-family:"JetBrains Mono";src:url("JetBrainsMono-latin.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"Pretendard";src:url("../assets/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-display:swap}
:root{
  --bg:#f6f8fc; --card:#fff; --ink:#111827; --sub:#4b5563; --mute:#7b8496; --line:#e5e7eb;
  --blue:#1d4ed8; --blue-s:#eef3ff; --green:#15803d; --green-s:#eaf7ee; --purple:#6d4fe0; --purple-s:#f1edff;
  --orange:#c2570c; --orange-s:#fff3e6; --pink:#be185d; --pink-s:#fdeef5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e9edf5;color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;word-break:keep-all}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--bg);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 88px 86px;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;display:flex;flex-direction:column}
.slide.active{opacity:1;visibility:visible}
.foot{position:absolute;left:88px;bottom:26px;font-size:19px;color:var(--mute);font-weight:800;display:flex;align-items:center;gap:10px}
.foot img{height:30px}
.foot .part{font-weight:700;color:#a3abba}
h1{font-size:92px;line-height:1.16;font-weight:850;letter-spacing:-.03em}
h2{font-size:54px;line-height:1.22;font-weight:850;letter-spacing:-.02em}
.blue{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px}
.mong{display:block;object-fit:contain}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.slide .rise{opacity:0;transform:translateY(24px)}
.slide.active .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0) * 1s)}
@keyframes rise{to{opacity:1;transform:none}}
.slide .pop{opacity:0;transform:scale(.9)}
.slide.active .pop{animation:pop .65s cubic-bezier(.2,.9,.25,1.2) forwards;animation-delay:calc(var(--d,0) * 1s)}
@keyframes pop{to{opacity:1;transform:none}}
.slide.settled .rise,.slide.settled .pop{opacity:1!important;transform:none!important;animation:none!important}
.march{stroke-dasharray:3 16;stroke-linecap:round;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-38}}

/* 장 머리 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:36px;flex:none}
.role-chip{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:850;padding:6px 22px 6px 10px;border-radius:999px;margin-bottom:10px;background:var(--blue-s);color:var(--blue)}
.role-chip img{height:48px}
.role-chip.t-green{background:var(--green-s);color:var(--green)}
.role-chip.t-purple{background:var(--purple-s);color:var(--purple)}
.role-chip.t-orange{background:var(--orange-s);color:var(--orange)}
.role-chip.t-pink{background:var(--pink-s);color:var(--pink)}
.role-chip .tm{font-size:18px;font-weight:800;background:#fff;border-radius:999px;padding:3px 12px;margin-left:4px}
.demo-btns{display:flex;flex-direction:column;gap:10px;align-items:flex-end;flex:none;margin-top:4px}
a.go{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-size:23px;font-weight:850;padding:14px 24px;border-radius:18px;background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(29,78,216,.25);transition:transform .15s;white-space:nowrap}
a.go:hover{transform:translateY(-3px)}
a.go.ghost{background:#fff;color:var(--blue);border:2px solid #c9d6fb;box-shadow:none;font-size:20px;padding:10px 18px}
.body{flex:1;min-height:0;margin-top:26px;display:flex;flex-direction:column}

/* 표지 */
.cover{justify-content:center}
.cover .logo{height:64px;margin-bottom:38px;align-self:flex-start}
.cover h1 .l2{display:block;font-size:60px;color:#4b5563;font-weight:750;margin-top:18px;letter-spacing:-.02em}
.cover h1 .grad{background:linear-gradient(90deg,#1d4ed8,#7c3aed 60%,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .date{margin-top:60px;font-size:27px;font-weight:700;color:var(--mute)}
.cover .hero{position:absolute;right:70px;top:120px;width:820px;height:840px}
.cover .hero svg{position:absolute;inset:0;width:100%;height:100%}
.cover .hero img{position:absolute}
.cover .text{max-width:1020px;position:relative;z-index:2}

/* 구분 장 */
.section{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#f6f8fc 30%,#e8eeff)}
.section img.mong{height:300px;margin-bottom:26px}
.section .pt{font-size:30px;font-weight:850;color:var(--blue);letter-spacing:.04em}
.section h1{font-size:104px;margin-top:8px}
.section p{font-size:36px;color:var(--sub);font-weight:600;margin-top:22px}
.section .tm{display:inline-block;margin-top:30px;font-size:26px;font-weight:850;color:var(--blue);background:#fff;border:2px solid #c9d6fb;border-radius:999px;padding:8px 26px}

/* 카드 */
.cards{display:grid;gap:22px;flex:1;min-height:0}
.bcard{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 32px;display:flex;flex-direction:column;gap:16px}
.bcard .ic{height:120px;display:flex;align-items:center}
.bcard .ic img{height:120px}
.bcard b{font-size:36px;font-weight:850;line-height:1.3}
.bcard p{font-size:27px;line-height:1.55;color:var(--sub);font-weight:600}
.bcard code,.li code,.pt-list code{font-family:"JetBrains Mono","Pretendard",monospace;font-size:.88em;background:#eef2f8;border-radius:8px;padding:2px 8px;color:#1e3a8a}
.bcard.t-blue{background:var(--blue-s);border-color:#c9d6fb}
.bcard.t-green{background:var(--green-s);border-color:#bfe3c9}
.bcard.t-purple{background:var(--purple-s);border-color:#d6cbfb}
.bcard.t-orange{background:var(--orange-s);border-color:#fed7aa}
.bcard.t-pink{background:var(--pink-s);border-color:#f9c9de}

/* 고민 말풍선 */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;flex:1;min-height:0}
.role{padding:34px 26px 30px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:20px;text-align:center}
.role .bubble{width:100%;flex:1;display:grid;place-items:center;border-radius:24px;padding:26px 20px;font-size:32px;font-weight:800;line-height:1.5;position:relative}
.role .bubble:after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-16px;border:16px solid transparent;border-bottom:0;border-top-color:inherit}
.role img{height:190px}
.role .who2{font-size:30px;font-weight:850}
.role.r1 .bubble{background:#ffece6;color:#9a3412;border-top-color:#ffece6}
.role.r2 .bubble{background:#e8f0ff;color:#1e3a8a;border-top-color:#e8f0ff}
.role.r3 .bubble{background:#efe9ff;color:#4c1d95;border-top-color:#efe9ff}
.role.r4 .bubble{background:#e4f5ea;color:#14532d;border-top-color:#e4f5ea}

/* 흐름 */
.flow{display:flex;align-items:stretch;gap:0;flex:none}
.flow .st{flex:1;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.flow .st img{height:130px}
.flow .st .n{font-size:20px;font-weight:850;color:var(--blue)}
.flow .st b{font-size:38px;font-weight:850}
.flow .st p{font-size:25px;line-height:1.5;color:var(--sub);font-weight:600}
.flow .ar{flex:none;width:56px;display:grid;place-items:center;font-size:40px;font-weight:900;color:var(--blue)}
.below{margin-top:26px;display:grid;gap:18px;flex:1;min-height:0;align-content:start}
.note-band{background:var(--blue-s);border:1px solid #c9d6fb;border-radius:20px;padding:22px 30px;font-size:29px;font-weight:700;line-height:1.5;color:#1e3a8a}
.note-band.t-orange{background:var(--orange-s);border-color:#fed7aa;color:#7c2d12}
.note-band.t-green{background:var(--green-s);border-color:#bfe3c9;color:#14532d}

/* 목록 */
.pt-list{display:flex;flex-direction:column;gap:14px}
.li{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 22px;font-size:27px;font-weight:650;line-height:1.45}
.li i{font-style:normal;flex:none;min-width:38px;height:38px;border-radius:999px;background:var(--blue);color:#fff;font-size:19px;font-weight:850;display:grid;place-items:center;padding:0 10px;margin-top:1px}
.li.t-green i{background:var(--green)} .li.t-purple i{background:var(--purple)} .li.t-orange i{background:var(--orange)}
.li b{font-weight:850}

/* 메뉴형 장 */
.mwrap{display:grid;grid-template-columns:400px 1fr;gap:30px;flex:1;min-height:0}
.mlist{display:flex;flex-direction:column;gap:10px}
.mi{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;text-align:left;font:inherit;background:#fff;border:2px solid var(--line);border-radius:20px;padding:11px 16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.mi img{height:54px;width:62px;object-fit:contain}
.mi .no{position:absolute;left:10px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;font-weight:850;display:grid;place-items:center;z-index:1}
.mi b{display:block;font-size:25px;font-weight:850;color:var(--ink);line-height:1.25}
.mi span{display:block;font-size:17px;color:var(--mute);font-weight:650;margin-top:2px}
.mi.on{border-color:var(--blue);background:var(--blue-s);box-shadow:0 10px 26px rgba(29,78,216,.16)}
.mi.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--blue)}
.mlist .legend{margin-top:auto;font-size:18px;line-height:1.55;font-weight:650;color:#7c2d12;background:var(--orange-s);border-radius:16px;padding:12px 16px}
.mpanel{position:relative;min-height:0}
.pane{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s;display:flex;flex-direction:column;gap:16px}
.pane.on{opacity:1;visibility:visible}
.phead{font-size:34px;font-weight:850;line-height:1.3;display:flex;align-items:center;gap:14px;flex:none}
.phead .tag{font-size:18px;font-weight:850;padding:5px 12px;border-radius:999px;background:var(--green-s);color:var(--green);white-space:nowrap}
.phead a.go{margin-left:auto;font-size:19px;padding:9px 16px;border-radius:14px}
.shotbox{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;cursor:zoom-in}
.shotbox img{max-width:100%;max-height:100%;border-radius:18px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(30,50,110,.14);background:#fff}
.chips{display:flex;gap:12px;flex-wrap:wrap;flex:none}
.who{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:700;line-height:1.35;padding:10px 18px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.who b{font-size:18px;font-weight:850;padding:4px 10px;border-radius:999px;color:#fff;flex:none;background:var(--blue)}
.who.t-green b{background:var(--green)} .who.t-purple b{background:var(--purple)} .who.t-orange b{background:var(--orange)}

/* 실시간(iframe) · 실습 */
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;flex:1;min-height:0}
.split.even{grid-template-columns:1fr 1fr}
.livebox{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 50px rgba(30,50,110,.14);min-height:0}
.livebox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f8fafc}
.livebox .wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:26px;font-weight:750;color:var(--mute);text-align:center;line-height:1.5}
.livebox .wait img{height:150px}
.livebox .badge{position:absolute;left:14px;bottom:14px;z-index:2;font-size:17px;font-weight:850;color:#fff;background:#dc2626;border-radius:999px;padding:4px 12px;pointer-events:none}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.codebox{background:#0f172a;border-radius:20px;padding:20px 24px 22px;position:relative;flex:none}
.codebox .cl{font-size:17px;font-weight:800;color:#94a3b8;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.codebox button{font:inherit;font-size:16px;font-weight:800;color:#e2e8f0;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:4px 12px;cursor:pointer}
.codebox pre{font-family:"JetBrains Mono","Pretendard",monospace;font-size:var(--cs,25px);line-height:1.55;color:#e2e8f0;white-space:pre;overflow:hidden;tab-size:4}
.codebox .k{color:#93c5fd} .codebox .s{color:#fcd34d} .codebox .n{color:#86efac} .codebox .c{color:#64748b} .codebox .f{color:#f9a8d4}
.task{border-radius:20px;padding:18px 24px;border:1px solid var(--line);background:#fff;flex:none}
.task h4{font-size:20px;font-weight:850;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.task p{font-size:27px;font-weight:700;line-height:1.45}
.task.chg{background:var(--orange-s);border-color:#fed7aa} .task.chg h4{color:var(--orange)}
.task.ask{background:var(--purple-s);border-color:#d6cbfb} .task.ask h4{color:var(--purple)}
.task.tip{background:var(--green-s);border-color:#bfe3c9} .task.tip h4{color:var(--green)}
.task code{font-family:"JetBrains Mono","Pretendard",monospace;font-size:.9em;background:rgba(255,255,255,.75);border-radius:8px;padding:1px 8px}
.pguide{margin-top:auto;display:flex;align-items:center;gap:26px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 28px}
.pguide img{height:150px;flex:none}
.pguide b{font-size:30px;font-weight:850;color:var(--blue)}
.pguide i{font-style:normal;font-size:26px;font-weight:900;color:#a3abba;margin:0 12px}
.pguide p{font-size:24px;font-weight:650;color:var(--sub);line-height:1.5;margin-top:8px}
.split.even .task p{font-size:30px}
.split.even .task{padding:22px 26px}
.stepno{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--blue);color:#fff;font-size:34px;font-weight:900;margin-right:16px;vertical-align:4px}

/* 그림 틀 */
.frame{position:relative;min-height:0;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 22px 60px rgba(30,50,110,.18);cursor:zoom-in;display:flex;align-items:flex-start;justify-content:center}
.frame img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.frame.contain{background:#f8fafc;align-items:center}
.frame.contain img{object-fit:contain}
.frame .lbl{position:absolute;left:14px;bottom:14px;font-size:17px;font-weight:850;color:#fff;background:rgba(17,24,39,.78);border-radius:999px;padding:5px 14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}
.split.wide{grid-template-columns:.78fr 1.5fr}
.split.half{grid-template-columns:1fr 1fr}
.lead2{font-size:33px;font-weight:800;line-height:1.5;color:#1f2937;margin-bottom:6px}
.lead2 b{color:var(--blue)}
.pt-list .codebox{margin-top:4px}
.note-band code{font-family:"JetBrains Mono","Pretendard",monospace;font-size:.88em;background:rgba(255,255,255,.7);border-radius:8px;padding:2px 8px}
.pt-list .note-band{margin-top:4px;font-size:26px}
.term{background:#0b1020;border-radius:22px;overflow:hidden;box-shadow:0 22px 60px rgba(30,50,110,.25);display:flex;flex-direction:column;min-height:0}
.term .tb{display:flex;align-items:center;gap:8px;padding:14px 18px;background:#161c33}
.term .tb span{width:14px;height:14px;border-radius:50%;background:#ef4444}.term .tb span:nth-child(2){background:#f59e0b}.term .tb span:nth-child(3){background:#22c55e}
.term .tb em{font-style:normal;color:#8b93a7;font-size:17px;font-weight:700;margin-left:10px}
.term pre{font-family:"JetBrains Mono","Pretendard",monospace;font-size:30px;line-height:1.6;color:#cbd5e1;padding:26px 30px}
.mosaic{display:grid;gap:18px;flex:1;min-height:0;grid-auto-rows:1fr}
.mosaic figure{position:relative;border-radius:22px;overflow:hidden;background:#0b1020;box-shadow:0 16px 44px rgba(30,50,110,.2);cursor:zoom-in;min-height:0}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic figcaption{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 14px;background:linear-gradient(transparent,rgba(5,8,20,.82));color:#fff;display:flex;align-items:baseline;gap:12px}
.mosaic figcaption b{font-size:27px;font-weight:850}
.mosaic figcaption span{font-size:19px;font-weight:650;color:#cbd5e1}
.mosaic.light figure{background:#fff;border:1px solid var(--line)}
.mosaic.light img{object-position:top center}
.livebox .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.livebox .poster + .wait{display:none}
.cover .heroshot{position:absolute;right:88px;top:150px;width:700px;height:780px;border-radius:36px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 30px 80px rgba(30,50,110,.2)}
.cover .heroshot img{width:100%;height:100%;object-fit:cover}
.endlinks{display:flex;gap:16px;margin-top:44px}
.endlinks a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 24px;text-align:left}
.endlinks a b{display:block;font-size:24px;font-weight:850;color:var(--ink)}
.endlinks a span{font-size:19px;font-weight:700;color:var(--blue)}
.ba td.hi{background:var(--blue-s);border-color:#c9d6fb;color:#1e3a8a;font-weight:850}
.ba.cmp td{font-size:26px;padding:17px 20px}
.ba.cmp td:first-child{color:var(--ink)}
body.print #hud,body.print #meta,body.print #help,body.print .livebox .badge{display:none}
body.print .rise,body.print .pop{opacity:1!important;transform:none!important;animation:none!important}
body.print .bob,body.print .friends img,body.print .march{animation:none!important}
body.print .slide{transition:none}
.body.stack{gap:18px}
.body.stack .frame{flex:1}
.body.stack .frame img{object-fit:cover;object-position:top center}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:none}
.row4 .li{font-size:24px}
.cards .bcard{justify-content:center}
.bcard p b{font-size:inherit;line-height:inherit}
.cards .bcard .ic,.cards .bcard .ic img{height:150px}
.ba td{padding:24px 22px}
.ba.cmp td{font-size:27px;padding:19px 22px}
.duo .frame{align-items:center}
/* 표 */
.ba{width:100%;border-collapse:separate;border-spacing:0 10px}
.ba th{font-size:22px;color:var(--mute);font-weight:800;text-align:left;padding:0 22px}
.ba td{background:#fff;font-size:28px;font-weight:700;padding:19px 22px;line-height:1.4;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ba td:first-child{border-left:1px solid var(--line);border-radius:16px 0 0 16px;font-weight:850;white-space:nowrap;color:var(--blue)}
.ba td:last-child{border-right:1px solid var(--line);border-radius:0 16px 16px 0}
.ba td small{display:block;font-size:21px;color:var(--mute);font-weight:650;margin-top:2px}
.ba tr.brk td{background:var(--orange-s);border-color:#fed7aa;color:#7c2d12}
.ba tr.brk td:first-child{color:#7c2d12}

/* 접속 안내 */
.urlbig{font-size:108px;font-weight:900;letter-spacing:-.03em;color:var(--blue);text-align:center;margin:30px 0 10px}
.urlsub{text-align:center;font-size:32px;font-weight:650;color:var(--sub)}

/* 링크 모음 */
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;flex:1;min-height:0;align-content:start}
.grp{padding:26px}
.grp h3{font-size:30px;font-weight:850;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.grp h3 img{height:56px}
.grp a{display:flex;justify-content:space-between;align-items:center;gap:14px;text-decoration:none;color:inherit;background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-top:10px;transition:all .15s}
.grp a:hover{border-color:var(--blue);background:var(--blue-s)}
.grp a b{font-size:24px;font-weight:800;display:block}
.grp a small{font-size:17px;color:var(--mute);font-weight:650}
.grp a .arr{font-size:26px;font-weight:900;color:var(--blue)}

/* 쉬는 시간 · 마무리 */
.center{justify-content:center;align-items:center;text-align:center}
.center img.big{height:380px}
.center .t1{font-size:100px;font-weight:900;letter-spacing:-.03em;margin-top:20px}
.center .t2{font-size:38px;font-weight:650;color:var(--sub);margin-top:16px}
.friends{display:flex;gap:26px;justify-content:center;margin-top:40px}
.friends img{height:130px;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--w)}

/* 조작부 */
#hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:6}
#hud i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
#meta{position:fixed;right:16px;top:12px;z-index:7;display:flex;gap:8px;font-size:13px;color:#9aa3b2;font-weight:700}
#meta span,#meta button{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font:inherit;color:inherit}
#meta button{cursor:pointer}
#meta button:hover{color:var(--blue);border-color:var(--blue)}
#help{position:fixed;left:16px;top:12px;z-index:7;font-size:12px;color:#9aa3b2;font-weight:600}
#notes{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(1100px,92vw);max-height:36vh;overflow:auto;z-index:8;background:rgba(17,24,39,.94);color:#f3f4f6;border-radius:16px;padding:16px 22px;font-size:17px;line-height:1.65;display:none}
#notes.show{display:block}
#notes h4{font-size:13px;color:#93c5fd;margin-bottom:6px}
#lightbox{position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.86);display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:3vh 3vw}
#lightbox.show{display:flex}
#lightbox img{max-width:94vw;max-height:88vh;border-radius:12px;background:#fff}
#lightbox p{color:#e5e7eb;font-size:16px;font-weight:700;text-align:center;margin-top:10px}
#toc{position:fixed;inset:0;z-index:15;background:rgba(15,23,42,.9);display:none;overflow:auto;padding:5vh 6vw}
#toc.show{display:block}
#toc h3{color:#fff;font-size:22px;margin-bottom:14px}
#toc ol{columns:3;column-gap:28px;list-style:none}
#toc li{break-inside:avoid;color:#e5e7eb;font-size:15px;font-weight:650;padding:7px 10px;border-radius:8px;cursor:pointer;line-height:1.35}
#toc li:hover{background:rgba(255,255,255,.12)}
#toc li.sec{color:#93c5fd;font-weight:850;margin-top:10px}
#toc li.cur{background:var(--blue);color:#fff}
@media (prefers-reduced-motion:reduce){.bob,.friends img,.march{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud"><i></i></div>
<div id="meta"><span id="timer" title="T: 타이머 다시 시작">0:00</span><button id="tocBtn" title="G: 목차">목차</button><button data-go="-1" title="이전">‹</button><span id="count">1 / 1</span><button data-go="1" title="다음">›</button></div>
<div id="help">← → 넘기기 · ↑ ↓ 메뉴 · G 목차 · F 전체 화면 · N 진행 메모 · T 타이머</div>
<div id="notes"></div>
<div id="toc"><h3>목차 — 눌러서 이동</h3><ol></ol></div>
<div id="lightbox"><div><img alt=""><p></p></div></div>

<script src="deck-data.js"></script>
<script src="deck.js"></script>
</body>
